name: Production availability and TLS

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Verify public HTTPS, redirect, and certificate expiration
        run: |
          [[ $SITE_URL =~ ^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]
          host=${SITE_URL#https://}
          for path in / /api/ready; do
            status=$(curl -fsS --max-time 10 --output /dev/null --write-out '%{http_code}' "$SITE_URL$path")
            [[ $status == 200 ]]
          done
          redirect=$(curl -fsS --max-time 10 --output /dev/null --write-out '%{redirect_url}' "http://$host/")
          [[ $redirect == "$SITE_URL/" ]]
          timeout 20 openssl s_client -connect "$host:443" -servername "$host" \
            -verify_hostname "$host" -verify_return_error </dev/null |
            openssl x509 -noout -checkend 1814400
