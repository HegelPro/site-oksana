name: Verify and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a release pull request from develop
        if: github.event_name == 'pull_request'
        env:
          PR_SOURCE: ${{ github.event.pull_request.head.ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ $PR_SOURCE != develop || $PR_REPOSITORY != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Open the release pull request from this repository's develop branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-and-build
      - name: Save the tested images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save site-oksana-ci-web site-oksana-ci-migrate | gzip > "$RUNNER_TEMP/release-images.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  images:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to production by SSH
    needs: images
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: site-oksana-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy the current commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          WEB_DIGEST: ${{ needs.images.outputs.web-digest }}
          MIGRATE_DIGEST: ${{ needs.images.outputs.migrate-digest }}
        run: bash ops/deploy-ssh.sh main
